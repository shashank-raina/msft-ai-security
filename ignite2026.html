<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stack Atlas</title>
<meta name="description" content="Microsoft security, end to end. Independent and unofficial.">
<style>
:root{
  --bg:#f6f7fb;--panel:#fff;--ink:#14171f;--mute:#5b6475;--line:#dfe3ec;--soft:#eef1f7;
  --ms:#2563eb;--lab:#0d9488;--heard:#d97706;--take:#db2777;
  --ga:#16a34a;--preview:#7c3aed;--none:#64748b;
  --plate1:#e8edf8;--plate2:#d6deef;--plate3:#c4cee6;--accent:#2563eb;--shadow:0 6px 24px rgba(20,30,60,.08);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c0f16;--panel:#141925;--ink:#e9edf6;--mute:#9aa4b8;--line:#263044;--soft:#1a2132;
  --ms:#60a5fa;--lab:#2dd4bf;--heard:#fbbf24;--take:#f472b6;
  --ga:#4ade80;--preview:#a78bfa;--none:#94a3b8;
  --plate1:#1b2438;--plate2:#222d47;--plate3:#2b3856;--accent:#60a5fa;--shadow:0 6px 24px rgba(0,0,0,.4);
}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
header.top{background:linear-gradient(135deg,#0b1736,#1d3a8a 55%,#0d9488);color:#fff;padding:28px 0 22px;position:relative;overflow:hidden}
header.top::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 20%,rgba(255,255,255,.18),transparent 45%);pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase;opacity:.9}
.brand svg{width:26px;height:26px}
header.top h1{margin:10px 0 6px;font-size:clamp(26px,5vw,40px);line-height:1.15}
header.top p{margin:0;max-width:640px;opacity:.92}
.asof{margin-top:14px;font-size:13px;opacity:.85;display:flex;flex-wrap:wrap;gap:6px 16px}
.toggles{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.toggles .wrap{display:flex;flex-wrap:wrap;gap:8px;padding-top:10px;padding-bottom:10px;align-items:center}
.toggles .lbl{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.tg{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--c);color:var(--ink);background:var(--panel);border-radius:99px;padding:5px 12px 5px 9px;font-size:13.5px;transition:background .2s,opacity .2s}
.tg i{width:12px;height:12px;border-radius:50%;background:var(--c);display:inline-block;transition:transform .2s}
.tg[aria-pressed="false"]{opacity:.55;border-style:dashed}
.tg[aria-pressed="false"] i{background:transparent;border:2px solid var(--c)}
.tg[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 14%,var(--panel))}
.tg small{color:var(--mute)}
.tg[disabled]{cursor:default}
.l-ms{--c:var(--ms)}.l-lab{--c:var(--lab)}.l-heard{--c:var(--heard)}.l-take{--c:var(--take)}
main{padding:22px 0 60px}
h2{font-size:22px;margin:30px 0 10px}
.sub{color:var(--mute);margin:0 0 14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
/* map */
.mapbox{padding:8px;position:relative}
#iso{display:block;width:100%;height:auto}
.mapnote{font-size:13px;color:var(--mute);padding:4px 12px 10px}
.phonelist{display:none}
.plate{fill:color-mix(in srgb,var(--pc) 20%,var(--panel));stroke:color-mix(in srgb,var(--pc) 55%,transparent);stroke-width:1.5}
.plateside{fill:color-mix(in srgb,var(--pc) 38%,var(--panel))}
.pl0{--pc:#6366f1}.pl1{--pc:#14b8a6}.pl2{--pc:#ec4899}
.drop{animation:drop .8s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes drop{from{opacity:0;transform:translateY(70px)}to{opacity:1;transform:none}}
.fadein{animation:fade .6s both}
.edges{animation:fade 1s 1.2s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.lift{transition:transform .22s ease,filter .22s}
.tile:hover .lift,.tile:focus .lift,.tile.on .lift{transform:translateY(-6px);filter:drop-shadow(0 10px 8px rgba(0,0,0,.28))}
.tile.pulse .top{animation:pulse .9s ease-out}
@keyframes pulse{0%{stroke-width:1.6}40%{stroke-width:7;stroke:var(--pc,var(--accent))}100%{stroke-width:1.6}}
.pktg{fill:#fff;stroke:var(--accent);stroke-width:3;filter:drop-shadow(0 0 8px var(--accent))}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.info{margin:10px 12px 12px;padding:10px 14px;border-radius:12px;background:var(--soft);border:1px solid var(--line);min-height:62px;font-size:14.5px}
.info b{font-size:15px}
.info .st{color:var(--mute);font-size:12.5px;display:block;margin-bottom:2px}
.platelabel{font-size:12.5px;font-weight:700;fill:var(--ink)}
.platesub{font-size:10.5px;fill:var(--mute)}
.tile{cursor:pointer;outline:none;transition:transform .2s,opacity .2s}
.tile .top{fill:var(--panel);stroke:var(--accent);stroke-width:1.6;transition:fill .2s}
.tile:hover .top,.tile:focus .top,.tile.on .top{fill:color-mix(in srgb,var(--accent) 18%,var(--panel))}
.tile text{font-size:11.5px;font-weight:600;fill:var(--ink);text-anchor:middle;pointer-events:none}
.tile.dim{opacity:.35}
.tile:focus-visible .top{stroke-width:3}
.edge{fill:none;stroke:var(--accent);stroke-width:1.4;stroke-dasharray:3 7;opacity:.5;animation:flow 1.6s linear infinite}
.edge.hot{opacity:1;stroke-width:2.4}
.edge.off{opacity:.07}
@keyframes flow{to{stroke-dashoffset:-20}}
.dot{fill:var(--accent)}
.stbadge{font-size:12px;border-radius:99px;padding:2px 9px;border:1px solid currentColor;display:inline-block;white-space:nowrap}
.s-private{color:#db2777}.s-ga{color:var(--ga)}.s-mixed{color:var(--accent)}.s-preview{color:var(--preview)}.s-none{color:var(--none)}
.layercard{padding:12px 14px;margin-bottom:10px}
.layercard h3{margin:0 0 2px;font-size:15px}
.layercard p{margin:0 0 8px;font-size:13px;color:var(--mute)}
.nodebtn{display:flex;width:100%;text-align:left;align-items:center;gap:10px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:6px}
.nodebtn svg{width:22px;height:22px;flex:none;stroke:var(--accent)}
.nodebtn b{display:block;font-size:14.5px}
.nodebtn span.t{display:block;font-size:12.5px;color:var(--mute)}

.pyr{display:flex;flex-direction:column;align-items:center;gap:6px;perspective:800px}
.ptier{padding:11px 7% 13px;text-align:center;position:relative;overflow:hidden;clip-path:polygon(6% 0,94% 0,100% 100%,0 100%);background:color-mix(in srgb,var(--pc) 24%,var(--panel));animation:tierin .7s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes tierin{from{opacity:0;transform:translateY(60px) scale(.9)}to{opacity:1;transform:none}}
.ptier::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);animation:sweep 6s ease-in-out infinite;animation-delay:var(--sd,0s);pointer-events:none}
@keyframes sweep{0%,60%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}
.ptl{font-weight:800;font-size:14.5px;letter-spacing:.01em}
.pts{font-size:11.5px;color:var(--mute);margin-bottom:8px}
.pchips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.pchip{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1 1 104px;max-width:170px;padding:10px 6px 9px;border-radius:14px;border:1.5px solid var(--accent);background:var(--panel);position:relative;transition:transform .2s,box-shadow .2s;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;animation-delay:var(--cd,0s);z-index:1}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.pchip svg{width:22px;height:22px;stroke:var(--accent)}
.pchip .pn{font-size:13px;font-weight:700;line-height:1.2}
.pchip .pc{font-size:10.5px;color:var(--mute)}
.pchip .pd{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 55%,transparent)}70%,100%{box-shadow:0 0 0 8px transparent}}
.pchip:active{transform:scale(.96)}
.pchip.on{transform:translateY(-4px) scale(1.05);box-shadow:0 10px 20px rgba(0,0,0,.28);background:color-mix(in srgb,var(--accent) 18%,var(--panel))}
.phonelist .info{margin:12px 0 0}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.stat{padding:10px 8px;text-align:center;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);animation:rise .5s both}
.stat b{display:block;font-size:26px;line-height:1.1;color:var(--accent)}
.stat span{font-size:12px;color:var(--mute)}
.sheetbg{position:fixed;inset:0;background:rgba(5,10,25,.55);z-index:50;opacity:0;transition:opacity .25s;display:flex;align-items:flex-end;justify-content:center}
.sheetbg.show{opacity:1}
.sheet{width:100%;max-width:560px;background:var(--panel);border-radius:22px 22px 0 0;padding:18px 18px 22px;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.9,.3,1);max-height:82vh;overflow:auto}
.sheetbg.show .sheet{transform:none}
.sheet h3{margin:6px 0 2px;font-size:20px}
.sheet .grab{width:42px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 8px}
.sheet .row{margin-top:12px}
.tile.fdim{opacity:.2}
.pchip.fdim{opacity:.3}
.pf{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin:0 0 6px;-webkit-overflow-scrolling:touch}
.pf .pill{white-space:nowrap;flex:none}
.pf-lbl{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 4px}
.tiercrumb{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.tiercrumb span{font-size:12px;border-radius:99px;padding:2px 10px;border:1px solid var(--line);background:var(--soft)}
/* timeline */
.tl{position:relative;padding:6px 0 6px 22px;margin:0;list-style:none}
.tl::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl li{position:relative;padding:8px 12px;margin:8px 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.tl li::before{content:"";position:absolute;left:-21px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--c,var(--ms));border:2px solid var(--bg)}
.tl time{font-size:12.5px;color:var(--mute);margin-right:8px}
/* page */
.crumb{margin:6px 0 10px}
.crumb button{background:none;border:none;color:var(--accent);padding:0;text-decoration:underline}
.hero{padding:18px 20px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.hero .ic{width:52px;height:52px;border-radius:14px;background:color-mix(in srgb,var(--accent) 14%,var(--panel));display:grid;place-items:center;flex:none}
.hero .ic svg{width:28px;height:28px;stroke:var(--accent)}
.hero h1{margin:0;font-size:clamp(22px,4vw,30px);line-height:1.2}
.hero .tag{color:var(--mute);margin:2px 0 8px}
ul.items{list-style:none;margin:0;padding:0}
ul.items li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);animation:rise .35s both}
ul.items li:first-child{border-top:none}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.chip{flex:none;font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;margin-top:3px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 40%,transparent);white-space:nowrap}
.sec{padding:16px 18px;margin-top:14px}
.sec h2{margin:0 0 6px;font-size:18px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.links a{font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:3px 11px;background:var(--soft)}
details.feat{border:1px solid var(--line);border-radius:12px;margin-top:10px;background:var(--panel);overflow:hidden}
details.feat summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600}
details.feat summary::-webkit-details-marker{display:none}
details.feat summary::after{content:"+";margin-left:auto;font-size:20px;color:var(--mute);transition:transform .2s}
details.feat[open] summary::after{transform:rotate(45deg)}
details.feat .body{padding:0 14px 10px}
.check{border-left:4px solid var(--heard);background:color-mix(in srgb,var(--heard) 8%,var(--panel))}
.check ul{margin:6px 0 0;padding-left:18px}
.conn{display:grid;gap:8px;margin-top:8px}
.conn button{display:flex;gap:8px;align-items:center;text-align:left;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.conn .arrow{color:var(--accent);font-weight:700}
.empty{color:var(--mute);font-style:italic}
footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--mute);font-size:13px}
/* models */
.model{padding:16px 18px;margin-top:14px;border:1.5px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 6%,var(--panel)),var(--panel))}
.model h2{margin:0 0 2px;font-size:18px}
.model .cap{font-size:13px;color:var(--mute);margin:0 0 12px}
.badge-ill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--preview);border:1px solid currentColor;border-radius:6px;padding:1px 6px;margin-right:6px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.btn{border:1.5px solid var(--accent);background:var(--panel);border-radius:10px;padding:6px 14px;font-size:14px}
.btn.on{background:var(--accent);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.pill{border:1.5px solid var(--line);background:var(--soft);border-radius:99px;padding:4px 12px;font-size:13.5px}
.pill.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--panel));font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=number]{font:inherit;padding:5px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);width:130px}
.big{font-size:30px;font-weight:700;line-height:1.1}
.meter{height:16px;background:var(--soft);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.meter>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--lab));transition:width .45s ease}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.pol{display:inline-block;margin:3px;padding:3px 8px;border-radius:8px;font-size:12px;background:var(--soft);border:1px solid var(--line);animation:rise .4s both}
.planbox{border:1.5px solid var(--accent);border-radius:12px;padding:8px;margin-bottom:8px;animation:rise .45s both}
.planbox b{font-size:13px}
.planbox .shared{font-size:11.5px;color:var(--mute)}
.stage{position:relative;height:150px;border:1px dashed var(--line);border-radius:12px;background:var(--soft);overflow:hidden}
.node{position:absolute;top:50%;transform:translateY(-50%);width:82px;text-align:center;font-size:12px;font-weight:600}
.node .bx{height:46px;border-radius:12px;border:2px solid var(--accent);background:var(--panel);display:grid;place-items:center;margin-bottom:4px}
.pkt{position:absolute;top:calc(50% - 7px);left:0;width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.pkt.bad{background:#dc2626;box-shadow:0 0 0 4px rgba(220,38,38,.25)}
.pkt.ok{background:var(--ga)}
.msg{margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--soft);border:1px solid var(--line);font-size:14px;min-height:42px}
.dots{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;max-width:480px}
.dots i{aspect-ratio:1;border-radius:50%;background:var(--line);transition:background .4s,transform .4s}
.dots i.on{background:var(--accent);transform:scale(1.05)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.step{flex:1 1 120px;border:1.5px solid var(--line);border-radius:10px;padding:8px;font-size:13px;background:var(--soft);transition:all .3s}
.step.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel))}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.bar .nm{width:120px;flex:none}
.bar .tr{flex:1;height:18px;background:var(--soft);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar .tr>div{height:100%;background:var(--accent);transition:width .5s}
.lvl{display:inline-block;padding:3px 14px;border-radius:99px;color:#fff;font-weight:700}
.lvl.low{background:#16a34a}.lvl.med{background:#d97706}.lvl.high{background:#dc2626}
@media(max-width:719px){
  .mapbox,.mapnote,.mapctl{display:none}
  .phonelist{display:block}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>

    box.appendChild(h("div", {class:"bar"}, h("span", {class:"nm"}, r[0]), h("div", {class:"tr"}, h("div", {style:"width:"+(r[1]/180*100)+"%"})), h("b", null, r[1]+" days")));
  });
  box.appendChild(h("p", {class:"cap"}, "The Partner Center post of November 18, 2026 says 90 days, up from 30."));
  if (STATE.lab){
    var labbox = h("div", {style:"margin-top:14px;padding:12px;border:1.5px dashed var(--lab);border-radius:12px"});
    labbox.appendChild(h("div", null, h("span", {class:"chip l-lab"}, "Labs and sessions · Slide"), " Cost estimate for non Microsoft data. Prices are from a session slide, US list, not on Learn. Check before you quote them."));
    var gb = h("input", {type:"number", value:"500", min:"0", step:"50", "aria-label":"GB per month"});
    var out = h("div", {class:"grid2", style:"margin-top:8px"});
    var mo = h("input", {type:"number", value:"12", min:"1", max:"144", step:"1", "aria-label":"Months of lake storage"});
    labbox.appendChild(h("div", {class:"row"}, h("span", null, "GB ingested per month"), gb, h("span", null, "Months in lake"), mo));
    labbox.appendChild(out); box.appendChild(labbox);
    var calc = function(){
      var g = Math.max(0, +gb.value || 0), m = Math.max(1, +mo.value || 1);
      var an = g*2.40, sen = g*4.30, lake = g*0.15, store = g*0.026*(m*(m+1)/2); // cumulative storage over m months of steady inflow
      clear(out);
      out.appendChild(h("div", null, h("div", {class:"big"}, "$"+an.toFixed(0)), h("small", null, "Analytics tier a month ($2.40 per GB)")));
      out.appendChild(h("div", null, h("div", {class:"big"}, "$"+sen.toFixed(0)), h("small", null, "Sentinel for comparison ($4.30 per GB)")));
      out.appendChild(h("div", null, h("div", {class:"big"}, "$"+lake.toFixed(0)), h("small", null, "Lake ingestion a month ($0.15 per GB)")));
      out.appendChild(h("div", null, h("div", {class:"big"}, "$"+store.toFixed(0)), h("small", null, "Lake storage over "+m+" months of steady inflow ($0.026 per GB per month)")));
    };
    gb.addEventListener("input", calc); mo.addEventListener("input", calc); calc();
  } else {
    box.appendChild(h("p", {class:"empty"}, "Switch on 'From the labs and sessions' to see the cost calculator built on session slide prices."));
  }
};

MODELS.perception = function(box){
  var dots = h("div", {class:"dots", role:"img", "aria-label":"One hundred alerts. Eighty are highlighted as covered by triage."});
  var cells = []; for (var i=0;i<100;i++){ var c = h("i"); cells.push(c); dots.appendChild(c); }
  var order = []; for (var j=0;j<100;j++) order.push(j);
  var seed = 7; order.sort(function(){ seed = (seed*9301+49297)%233280; return seed/233280 - .5; });
  var btn = h("button", {class:"btn", onclick:run}, "Run triage on 100 alerts");
  var msg = h("div", {class:"msg"}, "Microsoft says the Triage Agent covers about 80% of alerts in a typical Defender queue. Which alerts is random here.");
  box.appendChild(h("div", {class:"row"}, btn)); box.appendChild(dots); box.appendChild(msg);
  function run(){
    cells.forEach(function(c){ c.classList.remove("on"); });
    var k = 0, id = null;
    if (reduce){ order.slice(0,80).forEach(function(n){ cells[n].classList.add("on"); }); return; }
    id = setInterval(function(){ if (k>=80){ clearInterval(id); return; } cells[order[k]].classList.add("on"); k++; }, 25);
  }
};

MODELS.mdash = function(box){

MODELS.scu = function(box){
  var inp = h("input", {type:"range", min:"0", max:"30000", step:"100", value:"4000", "aria-label":"Paid user licences"});
  var n = h("input", {type:"number", value:"4000", min:"0", step:"100", "aria-label":"Paid user licences"});
  var big = h("div", {class:"big"}), mt = h("div", {class:"meter"}, h("div")), msg = h("div", {class:"msg"});
  box.appendChild(h("div", {class:"row"}, h("span", null, "Paid E5 or E7 user licences"), n));
  box.appendChild(inp); box.appendChild(h("div", {style:"margin-top:10px"}, big, h("small", null, "SCUs a month, shared across the whole tenant"))); box.appendChild(mt); box.appendChild(msg);
  function draw(v){
    v = Math.max(0, +v || 0);
    var scu = Math.min(v*0.4, 10000);
    big.textContent = Math.round(scu).toLocaleString("en-GB");
    mt.firstChild.style.width = (scu/10000*100)+"%";
    var over = Math.max(0, v*0.4 - 10000);
    msg.textContent = v >= 25000 ? "At 25,000 licences you hit the 10,000 a month cap. More licences don't add SCUs." : "Formula: 400 SCUs per 1,000 licences, capped at 10,000 a month. Unused SCUs don't roll over. Beyond the allocation, pay as you go is $6 per SCU when throttling starts, with 30 days notice.";
    if (over > 0) msg.textContent += " Your licences would give " + Math.round(over).toLocaleString("en-GB") + " more than the cap.";
  }
  inp.addEventListener("input", function(){ n.value = inp.value; draw(inp.value); });
  n.addEventListener("input", function(){ inp.value = Math.min(30000, +n.value||0); draw(n.value); });
  draw(4000);
};

/* ---------- routing ---------- */
function route(keepScroll){
  var hash = "";
  try { hash = (location.hash || "").replace(/^#\/?/, ""); } catch(e){}
  var y = window.scrollY;
  if (hash.indexOf("node/") === 0) nodePage(hash.slice(5)); else home();
  if (keepScroll) window.scrollTo(0, y);
}
function go(path){
  try { location.hash = path ? "/"+path : ""; } catch(e){}
  // preview sandboxes may ignore the hash change, so render directly as well
  var hash = path || "";
  if (hash.indexOf("node/") === 0) nodePage(hash.slice(5)); else { home(); window.scrollTo(0,0); }
}
window.addEventListener("hashchange", function(){ route(false); });

renderToggles();
route(false);
})();
