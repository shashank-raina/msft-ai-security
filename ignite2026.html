*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
header.top{background:#17202e;color:#fff;padding:18px 0 14px}
header.top h1{margin:0 0 4px;font-size:clamp(22px,4.2vw,30px);line-height:1.2;font-weight:700}
header.top p{margin:0;max-width:680px;opacity:.9;font-size:15px}
header.top p a{color:#fff;text-underline-offset:2px}
.asof{margin:0 0 10px;font-size:13px;display:flex;flex-wrap:wrap;gap:6px 16px}
.toggles{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.toggles .wrap{display:flex;flex-wrap:wrap;gap:8px;padding-top:10px;padding-bottom:10px;align-items:center}
.toggles .lbl{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.tg{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--c);color:var(--ink);background:var(--panel);border-radius:99px;padding:5px 12px 5px 9px;font-size:13.5px;transition:background .2s,opacity .2s}
.tg i{width:12px;height:12px;border-radius:50%;background:var(--c);display:inline-block;transition:transform .2s}
.tg[aria-pressed="false"]{opacity:.55;border-style:dashed}
.tg[aria-pressed="false"] i{background:transparent;border:2px solid var(--c)}
.tg[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 14%,var(--panel))}
.tg small{color:var(--mute)}
.tg[disabled]{cursor:default}
.l-ms{--c:var(--ms)}.l-lab{--c:var(--lab)}.l-heard{--c:var(--heard)}.l-take{--c:var(--take)}
main{padding:22px 0 60px}
h2{font-size:22px;margin:30px 0 10px}
.sub{color:var(--mute);margin:0 0 14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
/* home */
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.stbadge{font-size:12px;border-radius:99px;padding:2px 9px;border:1px solid currentColor;display:inline-block;white-space:nowrap}
.s-private{color:#db2777}.s-ga{color:var(--ga)}.s-mixed{color:var(--accent)}.s-preview{color:var(--preview)}.s-none{color:var(--none)}
.strip{margin:0 0 14px;color:var(--mute);font-size:14px}
.strip b{color:var(--ink)}
.tiers{display:grid;gap:26px;margin-top:8px}
.th{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.th h3{margin:0;font-size:19px}
.tc{font-size:13px;color:var(--mute)}
.ti{margin:8px 0 12px;color:var(--mute);font-size:14.5px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;align-items:start}
.acard{display:flex;flex-direction:column;gap:6px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:8px;transition:opacity .15s}
.acard .an{margin:0;font-weight:650;font-size:16px;line-height:1.3}
.acard .as{font-size:12px;font-weight:600}
.acard ul.ann{margin:2px 0 0;padding-left:18px}
.acard ul.ann li{padding:3px 0;font-size:14.5px;line-height:1.45}
.acard details.ck{margin-top:6px;font-size:13.5px;color:var(--mute)}
.acard details.ck summary{cursor:pointer;color:var(--accent)}
.acard details.ck ul{margin:6px 0 0;padding-left:18px}
.acard.fdim{opacity:.25}
.pf{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin:0 0 6px;-webkit-overflow-scrolling:touch}
.pf .pill{white-space:nowrap;flex:none}
.pf-lbl{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 4px}
.tiercrumb{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.tiercrumb span{font-size:12px;border-radius:99px;padding:2px 10px;border:1px solid var(--line);background:var(--soft)}
/* timeline */
.tl{position:relative;padding:6px 0 6px 22px;margin:0;list-style:none}
.tl::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl li{position:relative;padding:8px 12px;margin:8px 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.tl li::before{content:"";position:absolute;left:-21px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--c,var(--ms));border:2px solid var(--bg)}
.tl time{font-size:12.5px;color:var(--mute);margin-right:8px}
/* page */
.crumb{margin:6px 0 10px}
.crumb button{background:none;border:none;color:var(--accent);padding:0;text-decoration:underline}
.hero{padding:18px 20px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.hero .ic{width:52px;height:52px;border-radius:14px;background:color-mix(in srgb,var(--accent) 14%,var(--panel));display:grid;place-items:center;flex:none}
.hero .ic svg{width:28px;height:28px;stroke:var(--accent)}
.hero h1{margin:0;font-size:clamp(22px,4vw,30px);line-height:1.2}
.hero .tag{color:var(--mute);margin:2px 0 8px}
ul.items{list-style:none;margin:0;padding:0}
ul.items li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);animation:rise .35s both}
ul.items li:first-child{border-top:none}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.chip{flex:none;font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;margin-top:3px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 40%,transparent);white-space:nowrap}
.sec{padding:16px 18px;margin-top:14px}
.sec h2{margin:0 0 6px;font-size:18px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.links a{font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:3px 11px;background:var(--soft)}
details.feat{border:1px solid var(--line);border-radius:12px;margin-top:10px;background:var(--panel);overflow:hidden}
details.feat summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:600}
details.feat summary::-webkit-details-marker{display:none}
details.feat summary::after{content:"+";margin-left:auto;font-size:20px;color:var(--mute);transition:transform .2s}
details.feat[open] summary::after{transform:rotate(45deg)}
details.feat .body{padding:0 14px 10px}
.check{border-left:4px solid var(--heard);background:color-mix(in srgb,var(--heard) 8%,var(--panel))}
.check ul{margin:6px 0 0;padding-left:18px}
.conn{display:grid;gap:8px;margin-top:8px}
.conn button{display:flex;gap:8px;align-items:center;text-align:left;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.conn .arrow{color:var(--accent);font-weight:700}
.empty{color:var(--mute);font-style:italic}
footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--mute);font-size:13px}

.model{padding:16px 18px;margin-top:14px;border:1px solid var(--line);border-left:4px solid var(--accent)}
.model h2{margin:0 0 2px;font-size:18px}
.model .cap{font-size:13px;color:var(--mute);margin:0 0 12px}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.btn{border:1.5px solid var(--accent);background:var(--panel);border-radius:10px;padding:6px 14px;font-size:14px}
.btn.on{background:var(--accent);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.pill{border:1.5px solid var(--line);background:var(--soft);border-radius:99px;padding:4px 12px;font-size:13.5px}

.big{font-size:30px;font-weight:700;line-height:1.1}
.meter{height:16px;background:var(--soft);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.meter>div{height:100%;background:var(--accent);transition:width .45s ease}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.pol{display:inline-block;margin:3px;padding:3px 8px;border-radius:8px;font-size:12px;background:var(--soft);border:1px solid var(--line);animation:rise .4s both}
.planbox{border:1.5px solid var(--accent);border-radius:12px;padding:8px;margin-bottom:8px;animation:rise .45s both}
.planbox b{font-size:13px}
.planbox .shared{font-size:11.5px;color:var(--mute)}
.stage{position:relative;height:150px;border:1px dashed var(--line);border-radius:12px;background:var(--soft);overflow:hidden}
.node{position:absolute;top:50%;transform:translateY(-50%);width:82px;text-align:center;font-size:12px;font-weight:600}
.node .bx{height:46px;border-radius:12px;border:2px solid var(--accent);background:var(--panel);display:grid;place-items:center;margin-bottom:4px}
.pkt{position:absolute;top:calc(50% - 7px);left:0;width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.pkt.bad{background:#dc2626;box-shadow:0 0 0 4px rgba(220,38,38,.25)}
.pkt.ok{background:var(--ga)}
.msg{margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--soft);border:1px solid var(--line);font-size:14px;min-height:42px}
.dots{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;max-width:480px}
.dots i{aspect-ratio:1;border-radius:50%;background:var(--line);transition:background .4s,transform .4s}
.dots i.on{background:var(--accent);transform:scale(1.05)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.step{flex:1 1 120px;border:1.5px solid var(--line);border-radius:10px;padding:8px;font-size:13px;background:var(--soft);transition:all .3s}
.step.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel))}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.bar .nm{width:120px;flex:none}
.bar .tr{flex:1;height:18px;background:var(--soft);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar .tr>div{height:100%;background:var(--accent);transition:width .5s}
.lvl{display:inline-block;padding:3px 14px;border-radius:99px;color:#fff;font-weight:700}
.lvl.low{background:#16a34a}.lvl.med{background:#d97706}.lvl.high{background:#dc2626}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}

        h("h4", {class:"an"}, nd.name),
        h("span", {class:"as s-"+nd.status}, nd.statusLabel));
      var ul = h("ul", {class:"ann"});
      announcements(nd).forEach(function(it){ ul.appendChild(h("li", null, it.t)); });
      card.appendChild(ul);
      grid.appendChild(card);
    });
    wrap.appendChild(h("section", {class:"tier"},
      h("div", {class:"th"}, h("h3", null, T.label), h("span", {class:"tc"}, list.length + (list.length === 1 ? " announcement" : " announcements"))),
      h("p", {class:"ti"}, T.intro), grid));
  });
  return wrap;
}

/* ---------- views ---------- */
function home(){
  var app = $("app"); clear(app);
  app.appendChild(h("div", {class:"pf-lbl"}, "Filter by product"));
  app.appendChild(renderFilter());
  app.appendChild(renderTiers());
  applyFilter();

  app.appendChild(h("h2", null, "Dates to watch"));
  app.appendChild(h("p", {class:"sub"}, "Dates come from the Book of News. Phrases like 'this month' are converted to a rough date."));
  var ul = h("ul", {class:"tl"});
  var today = new Date().toISOString().slice(0,10);
  D.timeline.filter(function(t){ return t.d >= today && t.s === "BoN"; }).forEach(function(t){
    var L = layerOf(t.s);
    ul.appendChild(h("li", {class:"l-"+L},
      h("time", {datetime:t.d}, t.d), t.t));
  });
  app.appendChild(ul);
}


/* ---------- start ---------- */
home();
})();
</script>
</body>
</html>
